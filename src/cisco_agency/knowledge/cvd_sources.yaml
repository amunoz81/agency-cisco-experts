datacenter_ai:
  index_pages:
    - https://www.cisco.com/c/en/us/solutions/design-zone/data-center-design-guides.html
  cvds:
    - title: "Cisco ACI (Application Centric Infrastructure) Design Guide"
      url: https://www.cisco.com/c/en/us/td/docs/dcn/whitepapers/cisco-application-centric-infrastructure-design-guide.html
      version: "2025"
      summary: >-
        Topología spine-leaf (y multi-tier) con Nexus 9000 y APIC como
        controlador de política centralizado. Leaf = VTEP de conexión de cargas;
        spine = interconexión y mapeo endpoint-VTEP; APIC en clúster para
        redundancia. Construcciones: Tenants (partición), EPGs (segmentación por
        política), VRFs (routing multi-tenant), Contracts (política stateful
        entre EPGs). Prácticas: emparejar generaciones de HW en vPC, border leaf
        para L3 externo, versiones de SW consistentes en upgrades, dimensionar
        spines por escalabilidad de endpoints, aplicar política en ingress de VRF.
    - title: "Cisco Data Center Networking Blueprint for AI/ML Applications"
      url: https://www.cisco.com/c/en/us/td/docs/dcn/whitepapers/cisco-data-center-networking-blueprint-for-ai-ml-applications.html
      version: "2025"
      summary: >-
        Fabric de IA con Nexus 9000 (hasta 25.6 Tbps por ASIC, ~1.5 µs de
        latencia); Nexus 9300 93600CD-GX y 9332D-GX2B para spine-leaf. Transporte
        sin pérdida con RoCEv2 (RDMA sobre Ethernet): ECN marca en umbral de cola
        y PFC aplica pausa por enlace; juntos implementan DCQCN. Ejemplo de
        dimensionamiento: clúster de 1024 GPUs con diez leaf 93600CD-GX
        (256×100G) a cuatro spine 9332D-GX2B (80×400G) = fabric no bloqueante.
        Nexus Dashboard Insights (telemetría) y Fabric Controller (QoS lossless).
    - title: "VXLAN BGP EVPN Design and Implementation Guide"
      url: https://www.cisco.com/c/en/us/td/docs/dcn/whitepapers/cisco-vxlan-bgp-evpn-design-and-implementation-guide.html
      version: "2025"
      summary: >-
        Overlay VXLAN con plano de control BGP EVPN para fabric de datacenter
        multi-tenant y escalable (estándar abierto), alternativa a ACI para
        segmentación L2/L3 sobre Nexus 9000.

collaboration:
  index_pages:
    - https://www.cisco.com/c/en/us/solutions/enterprise/design-zone-collaboration/index.html
  cvds:
    - title: "Cisco Preferred Architecture for On-Premises Collaboration"
      url: https://www.cisco.com/c/dam/en/us/td/docs/solutions/PA/overview/15x/clbpa15x.pdf
      version: "15.x"
      summary: >-
        Control de llamadas con Unified CM (registro de endpoints y enrutamiento)
        en clúster para redundancia. Expressway como borde (acceso remoto seguro
        y conectividad híbrida/nube) en pares HA; MRA para acceso externo sin
        VPN. CUBE como gateway PSTN (negociación de codecs y traducción de
        protocolo). Unity (mensajería unificada), IM&P (mensajería y presencia)
        y endpoints. Prácticas: redundancia geográfica, segregar voz/datos,
        monitoreo con RTMT, hardening (reglas de firewall, gestión de
        credenciales, parcheo regular).
