# ============================================================================
# Catálogo de Cisco Validated Designs (CVDs) por arquitectura.
# ----------------------------------------------------------------------------
# Fuente de "aprendizaje" de los agentes: `cisco-agency ingest-cvd` convierte
# cada entrada en un documento del corpus (knowledge/corpus/) que el retriever
# usa para fundamentar los hallazgos (grounding) con cita a la fuente oficial.
#
# NOTA: cisco.com bloquea el scraping automático (WAF/403). Por eso el catálogo
# guarda título + URL oficial + un resumen técnico. Para texto COMPLETO, descarga
# el CVD (PDF/HTML) a knowledge/cvd_downloads/ y referencia `local_file`; el
# ingester lo parsea y enriquece el documento. Índice oficial de CVDs:
# https://www.cisco.com/site/us/en/solutions/cisco-validated/index.html
#
# `index_pages` por arquitectura son las páginas "ver todas las guías" para
# ampliar el catálogo (agrega nuevas entradas bajo `cvds`).
# Estado por defecto de las entradas: verificada (fuente oficial de Cisco).
# ============================================================================

retrieved: "2026-09-15"

secure_networking:
  index_pages:
    - https://www.cisco.com/c/en/us/solutions/design-zone/campus-branch.html
  cvds:
    - title: "Campus LAN and WLAN Design Guide (CVD)"
      url: https://www.cisco.com/c/en/us/td/docs/solutions/CVD/Campus/cisco-campus-lan-wlan-design-guide.html
      version: "2025"
      summary: >-
        Catalyst 9000 en todo el diseño: acceso (9200/9300, 9400 modular),
        distribución (9400/9500/9600) y core (9500/9600). Wireless con Catalyst
        9800 (appliance/virtual/embebido, 250-6000 APs) y APs Catalyst 9100
        Wi-Fi 6. Recomienda capa de distribución simplificada con StackWise
        Virtual o stacks (uplinks activo-activo por EtherChannel, sin bloqueo
        STP). Segmentación avanzada con SD-Access (fabric overlay, políticas por
        intención wired/wireless) o BGP EVPN VXLAN (estándar abierto). Wireless
        en modo centralizado, FlexConnect o fabric SD-Access. Dimensionamiento:
        oversubscription acceso-distribución ~3.6:1, distribución-core ~4:1;
        mGig 2.5-5 Gbps y PoE+ (90-100W) para 802.11ax. Alta disponibilidad con
        SSO, NSF e ISSU para upgrades sin downtime.
    - title: "Cisco Catalyst SD-WAN Design Guide (CVD)"
      url: https://www.cisco.com/c/en/us/td/docs/solutions/CVD/SDWAN/cisco-sdwan-design-guide.html
      version: "2025"
      summary: >-
        Cuatro planos: orquestación (SD-WAN Validator/NAT traversal), gestión
        (SD-WAN Manager), control (SD-WAN Controllers) y datos (WAN Edge).
        Segmentación con VPNs: VPN 0 transporte, VPN 512 gestión OOB, VPNs
        1-511 de servicio para datos. Cifrado AES-256 GCM con anti-replay
        (ventanas 64-4096; 4096 recomendado con QoS). OMP distribuye rutas,
        políticas y llaves por DTLS/TLS. Application-aware routing con SLA por
        sondas BFD (pérdida/latencia/jitter). Buenas prácticas: controladores
        redundantes por transporte, autenticación por certificados y lista de
        equipos autorizados, aprovisionamiento ZTP/PnP y segmentación por VPNs.
    - title: "Cisco Secure Network Reference Architecture"
      url: https://www.cisco.com/c/en/us/td/docs/solutions/CVD/Campus/Intro-Cisco-Secure-Network-Architecture.html
      version: "2025"
      summary: >-
        Arquitectura de referencia que fusiona red y seguridad de extremo a
        extremo (campus, sucursal, WAN y nube) con identidad (ISE/Duo),
        segmentación y aplicación de política consistente. Base para posicionar
        Secure Networking como capa de conectividad y segmentación.
    - title: "Cisco SASE/SSE Architecture Guide (sucursal y trabajo remoto)"
      url: https://www.cisco.com/c/en/us/solutions/collateral/enterprise/design-zone-security/sase-sse-ag.html
      version: "2025"
      summary: >-
        SASE converge red y seguridad en el borde como servicios de nube para la
        fuerza de trabajo híbrida (sucursal, remoto, SaaS). Security Service Edge
        (SSE) consolida DNS-layer security, Secure Web Gateway (SWG),
        Firewall-as-a-Service (FWaaS), CASB, DLP y Zero Trust Network Access
        (ZTNA). SD-WAN optimiza el enrutamiento multi-enlace con acceso directo a
        Internet (evita backhaul al datacenter). ZTNA aplica segmentación a nivel
        de aplicación con MFA y postura de dispositivo. Marco de tres pilares:
        identidad de usuario/dispositivo, conectividad red/nube y acceso a
        aplicación/datos. Se despliega como SASE unificado (un proveedor) o SSE
        modular, con transición gradual desde arquitecturas heredadas; Digital
        Experience Monitoring da visibilidad de la experiencia de extremo a extremo.
    - title: "Cisco SD-Access Solution Design Guide (CVD)"
      url: https://www.cisco.com/c/en/us/td/docs/solutions/CVD/Campus/cisco-sda-design-guide.html
      version: "2025"
      summary: >-
        Guía de diseño de Cisco Software-Defined Access (SD-Access), la solución
        de fabric para campus orquestada por Catalyst Center. Separa tres planos:
        control (LISP, con Map-Server/Map-Resolver que rastrea endpoints y los
        asocia al RLOC del edge node), datos (VXLAN para el overlay) y política
        (TrustSec con SGT). Roles de fabric: edge node (conexión de endpoints y
        registro en el control plane), border node (externo como gateway de
        último recurso hacia fuera del fabric; interno para registrar subredes
        conocidas) y control plane node. El underlay se aprovisiona típicamente
        con IS-IS vía LAN Automation; el overlay se construye encima sin que el
        tráfico de cliente use el underlay. En sitios pequeños los tres roles
        pueden colapsarse en un mismo dispositivo; en diseños de alta
        disponibilidad, border y control plane suelen colocarse en un par
        redundante de core con enlace cruzado. El diseño multisitio enlaza
        fabrics mediante señalización LISP y encapsulación VXLAN, con rutas de
        underlay conocidas entre los loopbacks de los border nodes.
    - title: "Cisco Secure Networking SD-Access Deployment Guide"
      url: https://www.cisco.com/c/en/us/td/docs/solutions/CVD/Campus/Cisco-Secure-Networking-SD-Access-Deployment-Guide.html
      version: "oct 2026"
      summary: >-
        Guía de despliegue validada para un fabric SD-Access de campus de escala
        media en un único sitio, construida sobre la Cisco Secure Network
        Reference Architecture y orquestada con Catalyst Center. Underlay
        enrutado con OSPF aprovisionado por LAN Automation; overlay LISP/VXLAN
        con macro-segmentación basada en VRF y micro-segmentación con Cisco ISE y
        TrustSec (SGT) para política consistente wired/wireless. Línea base
        validada: IOS XE 17.18.2 en nodos de fabric, fusion y controladoras
        wireless, con Catalyst Center en la rama 3.x. Cubre planeación del
        despliegue, conectividad cableada e inalámbrica, integraciones de
        seguridad (ISE/TrustSec) y validación del diseño. Las fabric zones son
        obligatorias en sitios de gran escala para limitar el dominio de fallas,
        con un máximo de dispositivos de fabric por zona según el appliance de
        Catalyst Center. Referencia para clientes que requieren segmentación de
        identidad y aplicación de política de seguridad integradas directamente
        en la arquitectura de campus, no solo como una capa superpuesta.

security:
  index_pages:
    - https://www.cisco.com/c/en/us/solutions/design-zone.html
  cvds:
    - title: "Cisco Zero Trust Access (At a Glance)"
      url: https://www.cisco.com/c/en/us/products/collateral/security/secure-access/zero-trust-access-aag.html
      version: "2025"
      summary: >-
        Zero Trust identity-first que unifica Cisco Secure Access (SASE/ZTNA),
        Duo (MFA) e ISE (control de acceso a la red). Combina verificación de
        identidad con postura del dispositivo, extendiendo confianza a IoT/OT.
        Acceso de mínimo privilegio, ajustado dinámicamente por comportamiento
        del usuario, postura y condiciones de red. Aplicación unificada en nube
        y on-prem; integración SD-WAN para desplegar política en remoto, sucursal
        y campus; detección de Shadow AI. Adopción incremental empezando por la
        mayor necesidad (Secure Access, ISE o Duo).
    - title: "Cisco Hypershield (seguridad distribuida AI-native)"
      url: https://www.cisco.com/c/en/us/products/collateral/security/hypershield/hypershield-so.html
      version: "2025"
      summary: >-
        Plataforma de seguridad AI-native que distribuye la aplicación de política
        en la infraestructura (workloads, VMs, contenedores, clústeres Kubernetes
        y, a futuro, DPUs, aceleradores y switches) en lugar de appliances de
        perímetro. Usa el Tesseract Security Agent sobre Isovalent Tetragon y eBPF
        para enforcement a nivel de kernel con visibilidad profunda del
        comportamiento de la aplicación. Segmentación autónoma: la IA aprende los
        patrones de comunicación legítimos y genera/afina reglas (reemplaza el
        proceso manual de 40+ días). Protección distribuida ante exploits:
        prioriza vulnerabilidades por explotación activa y criticidad, y aplica
        mitigaciones mientras se parchea. Actualizaciones auto-cualificadas con
        doble plano de datos (prueba contra tráfico real antes de desplegar).
    - title: "Cisco Secure Workload (micro-segmentación de aplicaciones)"
      url: https://www.cisco.com/c/en/us/products/collateral/security/secure-workload/sec-workload-firewall-wp.html
      version: "2025"
      summary: >-
        Micro-segmentación Zero Trust para datacenter y multi-nube. Telemetría
        con agente (procesos, flujos, vulnerabilidades para forense y monitoreo
        en tiempo real) y sin agente (aprovecha la infraestructura de red).
        Algoritmos de ML descubren clústeres de aplicaciones y dependencias, y
        generan automáticamente políticas de micro-segmentación por workload.
        Orquestación consistente sobre bare-metal, VMs y contenedores
        (Kubernetes) y en AWS, Azure y GCP (agentless). Reduce la superficie de
        ataque y el movimiento lateral; se integra con Secure Firewall.
    - title: "Cisco SAFE Reference Architecture (Secure Firewall / PINs)"
      url: https://www.cisco.com/c/en/us/solutions/collateral/enterprise/design-zone-security/safe-overview-guide.html
      version: "2025"
      summary: >-
        SAFE es la arquitectura de referencia de seguridad de Cisco: organiza el
        diseño por Places in the Network (campus, sucursal, edge, datacenter,
        nube) y por capacidades (defensa de amenazas, segmentación, control de
        acceso, visibilidad). Cisco Secure Firewall (Threat Defense) es el punto
        de aplicación de perímetro/DC (IPS, URL, malware, TLS). Incluye CVDs
        validados por PIN (Secure Campus, Secure Branch, Secure Edge, Secure Data
        Center). Base para justificar el firewall y el mapa de controles.
    - title: "Cisco XDR (detección y respuesta extendida)"
      url: https://www.cisco.com/c/en/us/products/collateral/security/xdr/xdr-aag.html
      version: "2025"
      summary: >-
        XDR en la nube que correlaciona seis telemetrías clave del SOC: endpoint,
        red, firewall, correo, identidad y DNS. Motor de IA con analítica de
        comportamiento, detección de anomalías y reconocimiento de patrones para
        hallar IOCs sutiles. Prioriza incidentes por riesgo material usando MITRE
        ATT&CK (TTPs) y criticidad del activo. XDR Forensics recolecta artefactos
        y habilita respuesta remota; integra soluciones Cisco y de terceros.
        Complementa a Splunk y Secure Network Analytics en el SOC.
    - title: "Cisco Breach Protection Suite Design Guide"
      url: https://www.cisco.com/c/en/us/solutions/collateral/enterprise/design-zone-security/breach-protection-suite-dg.html
      version: "2023"
      summary: >-
        Guía de diseño que integra los componentes del Cisco Breach Protection
        Suite bajo Cisco XDR como motor de correlación: Secure Endpoint
        (protección de endpoint), Email Threat Defense (protección del correo),
        Secure Client (acceso remoto), Secure Network Analytics (detección
        heurística de anomalías en tráfico de red mediante NetFlow) y Umbrella
        (seguridad DNS/SWG). XDR agrega la telemetría de estos productos para
        automatizar la investigación y reducir el tiempo de respuesta ante
        incidentes. Incluye pasos de integración por producto y pruebas de
        validación concretas (por ejemplo, detección de DNS rogue y bloqueo de
        DNS tunneling) para comprobar que la telemetría llega correctamente a
        XDR. El empaquetado por niveles (Essentials/Advantage) determina qué
        productos se incluyen; Secure Network Analytics suele formar parte del
        nivel superior. Sirve como referencia para dimensionar una arquitectura
        de detección y respuesta extendida apoyada en productos de seguridad
        Cisco existentes en lugar de una plataforma aislada, reforzando la
        integración end-to-end endpoint-red-correo-DNS.
    - title: "SAFE Secure Campus Architecture Guide"
      url: https://www.cisco.com/c/en/us/solutions/collateral/enterprise/design-zone-security/safe-secure-campus-architecture-guide.html
      version: "2023"
      summary: >-
        Guía de arquitectura del modelo SAFE enfocada en el Place in the Network
        (PIN) de campus. Parte de los flujos de negocio propios del campus,
        identifica las amenazas que los afectan (phishing, exploits web, acceso
        no autorizado a la red, propagación de malware y riesgos de BYOD) y las
        asocia a capacidades de seguridad agrupadas en tres niveles: fundacional
        y de acceso (requeridas por todo flujo) y de negocio (controles
        adicionales según el riesgo de la actividad, a menudo fuera del propio
        campus). Organiza la superficie de ataque en capas humana, de
        dispositivos, de red, de aplicaciones y de gestión. La arquitectura de
        red sigue el diseño clásico acceso-distribución-core, escalando mediante
        la incorporación de bloques de distribución a medida que crecen pisos o
        edificios. Partes del diseño fueron validadas en laboratorios de Cisco,
        con documentación disponible en Cisco Design Zone. Marco para justificar
        controles de campus alineados a SAFE frente a los PIN de sucursal,
        borde, datacenter y nube.
    - title: "SAFE Secure Edge Architecture Guide"
      url: https://www.cisco.com/c/en/us/solutions/collateral/enterprise/design-zone-security/safe-secure-edge-architecture-guide.html
      version: "2023"
      summary: >-
        Guía de arquitectura SAFE para el Place in the Network (PIN) de borde
        (edge), el punto donde la organización se conecta con el exterior
        (Internet, partners, clientes). Mapea los flujos de negocio del borde a
        controles funcionales según el tipo de riesgo que representan. Entre las
        amenazas cubiertas están las vulnerabilidades de servidores web expuestos
        y la interceptación/redirección de tráfico mediante compromiso de correo,
        proxies web o servicios DNS, usados por un atacante para insertarse en
        las comunicaciones entre la organización y sus partners o clientes. Al
        igual que las demás guías SAFE, agrupa capacidades en fundacional, de
        acceso y de negocio, ubicándolas en la arquitectura según dónde se origina
        cada flujo (campus, sucursal o ubicaciones externas). Señala que una
        misma arquitectura puede derivar en múltiples diseños según requisitos de
        desempeño, redundancia y escala, e incluye un diagrama de productos
        validados en laboratorio además de un apéndice con productos sugeridos.
        Complementa las guías SAFE de campus, sucursal, datacenter, nube e
        Internet para cubrir todos los PIN de la organización.

it_ot:
  index_pages:
    - https://www.cisco.com/c/en/us/solutions/design-zone/industries/manufacturing.html
  cvds:
    - title: "Networking and Security in Industrial Automation Environments (CVD)"
      url: https://www.cisco.com/c/en/us/td/docs/solutions/Verticals/Industrial_Automation/IA_Horizontal/DG/Industrial-AutomationDG.html
      version: "DG"
      summary: >-
        Diseño de referencia OT para entornos IACS de planta. Aplica red,
        seguridad y gestión de datos a activos de producción. Zonas de confianza
        alineadas a IEC 62443 (zonas y conductos) y modelo Purdue. Visibilidad
        de todos los activos industriales y sus flujos con Cisco Cyber Vision
        (inventario dinámico, monitoreo de zonas/conductos, evaluación de riesgo
        y exposición). Provee segmentación macro/zona, control de acceso a zona,
        detección y respuesta; coordinación con seguridad de TI para política de
        acceso consistente y agregación de eventos OT en el SOC.
    - title: "Cisco Industrial Security 3.1 Design Guide"
      url: https://www.cisco.com/c/dam/en/us/td/docs/Technology/Industrial-Security-3-1-DG.pdf
      version: "3.1 (jun 2025)"
      summary: >-
        Guía de seguridad industrial: construcción de zonas de confianza y
        conductos IEC 62443, IDMZ en la frontera IT/OT, ubicación de sensores
        Cyber Vision (embebidos en switches Catalyst IE y dedicados), control de
        acceso con ISE/TrustSec y firewall industrial, y estrategia de adopción
        sin afectar producción.

observability_soc:
  index_pages:
    - https://www.cisco.com/c/en/us/solutions/design-zone.html
  cvds:
    - title: "Cisco Data Center Networking Blueprint (telemetría / Nexus Dashboard)"
      url: https://www.cisco.com/c/en/us/td/docs/dcn/whitepapers/cisco-data-center-networking-blueprint-for-ai-ml-applications.html
      version: "2025"
      summary: >-
        Observabilidad de fabric con Nexus Dashboard Insights (telemetría) y
        Nexus Dashboard Fabric Controller (automatización de QoS). Base para
        correlación de calidad y disponibilidad. Complementar con Splunk
        (SIEM/SOAR) y ThousandEyes (experiencia digital) según necesidad de
        correlación cross-domain.
    - title: "Cisco ThousandEyes (monitoreo de experiencia digital)"
      url: https://www.cisco.com/c/dam/m/en_in/pdf/thousandeyes-platform-overview.pdf
      version: "2025"
      summary: >-
        Plataforma de Digital Experience Monitoring para ver, entender y mejorar
        la experiencia sobre cualquier red. Tres tipos de agente: Enterprise
        Agents (software ligero en campus, datacenter, VPC/VNet y sucursales; con
        monitoreo activo, SNMP y mapeo topológico), Cloud Agents (gestionados por
        ThousandEyes en 200+ ciudades para simular la experiencia del usuario vía
        ISPs de última milla) y Endpoint Agents (experiencia desde el dispositivo
        del usuario). Se despliega en OVA/VM, Linux, Cisco Catalyst 9000, SD-WAN,
        Docker y AWS/Azure/GCP. Flujo de diseño: definir qué datos capturar y
        desde dónde, configurar pruebas y visualizar. Ideal para correlación de
        experiencia hacia el SOC (con Splunk) y validación de rutas a SaaS/nube.
    - title: "Cisco ThousandEyes Enterprise Agent en Catalyst 9000 (deployment)"
      url: https://www.cisco.com/c/en/us/products/collateral/switches/catalyst-9400-series-switches/guide-c07-2431113.html
      version: "2025"
      summary: >-
        Guía de despliegue de agentes Enterprise de ThousandEyes embebidos en
        switches Catalyst 9000, para instrumentar el campus con vantage points
        internos sin hardware adicional. Complementa la observabilidad de red con
        pruebas activas desde el propio acceso.

datacenter_ai:
  index_pages:
    - https://www.cisco.com/c/en/us/solutions/design-zone/data-center-design-guides.html
  cvds:
    - title: "Cisco ACI (Application Centric Infrastructure) Design Guide"
      url: https://www.cisco.com/c/en/us/td/docs/dcn/whitepapers/cisco-application-centric-infrastructure-design-guide.html
      version: "2025"
      summary: >-
        Topología spine-leaf (y multi-tier) con Nexus 9000 y APIC como
        controlador de política centralizado. Leaf = VTEP de conexión de cargas;
        spine = interconexión y mapeo endpoint-VTEP; APIC en clúster para
        redundancia. Construcciones: Tenants (partición), EPGs (segmentación por
        política), VRFs (routing multi-tenant), Contracts (política stateful
        entre EPGs). Prácticas: emparejar generaciones de HW en vPC, border leaf
        para L3 externo, versiones de SW consistentes en upgrades, dimensionar
        spines por escalabilidad de endpoints, aplicar política en ingress de VRF.
    - title: "Cisco Data Center Networking Blueprint for AI/ML Applications"
      url: https://www.cisco.com/c/en/us/td/docs/dcn/whitepapers/cisco-data-center-networking-blueprint-for-ai-ml-applications.html
      version: "2025"
      summary: >-
        Fabric de IA con Nexus 9000 (hasta 25.6 Tbps por ASIC, ~1.5 µs de
        latencia); Nexus 9300 93600CD-GX y 9332D-GX2B para spine-leaf. Transporte
        sin pérdida con RoCEv2 (RDMA sobre Ethernet): ECN marca en umbral de cola
        y PFC aplica pausa por enlace; juntos implementan DCQCN. Ejemplo de
        dimensionamiento: clúster de 1024 GPUs con diez leaf 93600CD-GX
        (256×100G) a cuatro spine 9332D-GX2B (80×400G) = fabric no bloqueante.
        Nexus Dashboard Insights (telemetría) y Fabric Controller (QoS lossless).
    - title: "VXLAN BGP EVPN Design and Implementation Guide"
      url: https://www.cisco.com/c/en/us/td/docs/dcn/whitepapers/cisco-vxlan-bgp-evpn-design-and-implementation-guide.html
      version: "2025"
      summary: >-
        Overlay VXLAN con plano de control BGP EVPN para fabric de datacenter
        multi-tenant y escalable (estándar abierto), alternativa a ACI para
        segmentación L2/L3 sobre Nexus 9000.
    - title: "Cisco AI PODs (infraestructura modular para IA — Secure AI Factory)"
      url: https://www.cisco.com/c/en/us/products/collateral/servers-unified-computing/ucs-c-series-rack-servers/ai-pods-aag.html
      version: "2025"
      summary: >-
        Infraestructura full-stack pre-validada para IA empresarial (base de la
        Cisco Secure AI Factory con NVIDIA): cómputo UCS (C845A/C885A M8) con GPUs
        NVIDIA H100/H200 y RTX PRO 6000 Blackwell, y red Nexus 9000 hasta 800G
        lossless de baja latencia. Diseños pre-validados (CVDs + NVIDIA Enterprise
        Reference Architectures, p. ej. ERA 2-8-9-400) y gestión unificada con
        Intersight. Diseño modular por unidades de escala de 32 a 128+ GPUs;
        soporta entrenamiento, fine-tuning e inferencia. Reduce el tiempo de
        puesta en marcha hasta ~50% frente a un armado a la medida (DIY).
    - title: "Cisco AI POD for Enterprise Training and Fine-Tuning Design Guide"
      url: https://www.cisco.com/c/en/us/td/docs/unified_computing/ucs/UCS_CVDs/cisco_ai_pod_for_training_design.html
      version: "ene 2026"
      summary: >-
        Guía de diseño que detalla el AI POD de Cisco para entrenamiento y
        fine-tuning empresarial, combinando servidores UCS C885A M8 (fijo de 8
        GPU, módulos NVIDIA SXM o AMD OAM) y UCS C845A M8 (PCIe, 2/4/6/8 GPUs)
        con dos fabrics independientes sobre switches Nexus 9000. El fabric
        backend (GPU-a-GPU) es spine-leaf de dos niveles sin bloqueo, con
        unidades de escala: Type 1 (dos leaf N9k-C9332D-GX2B) hasta 4 nodos
        C885A (32 GPUs), y Type 2 (dos leaf N9k-C9364D-GX2A) hasta 8 nodos (64
        GPUs). En el C845A, dos GPUs comparten una NIC east-west, reduciendo el
        consumo de puertos de switch por nodo y elevando la densidad de GPU por
        unidad de escala frente al C885A. El fabric frontend maneja gestión,
        almacenamiento y tráfico de usuario; NVIDIA recomienda al menos 12.5
        Gbps de ancho de banda de storage por GPU (100 Gbps para un C885A de 8
        GPU). El diseño está avalado para la NVIDIA Enterprise Reference
        Architecture ERA 2-8-9-400, validado con C885A y Nexus 9000 contra los
        requisitos de ancho de banda y latencia de H200.
    - title: "FlexPod with Cisco AI POD: Infrastructure for AI Training and Fine-Tuning Deployment Guide"
      url: https://www.cisco.com/c/en/us/td/docs/unified_computing/ucs/UCS_CVDs/flexpod_aipod_training_manual.html
      version: "feb 2026"
      summary: >-
        Guía de despliegue que integra el AI POD de Cisco (servidores UCS C885A
        M8 con GPU) como tenant sobre una infraestructura FlexPod Datacenter ya
        desplegada (FlexPod Base), combinando cómputo Cisco con almacenamiento
        NetApp. El lado de storage usa controladores NetApp AFF A90 con
        FlexGroup, NFSv4.1 y RDMA, además de NVIDIA GPUDirect Storage para
        acceso directo de las GPU al almacenamiento sin pasar por la CPU,
        reduciendo la latencia en cargas de entrenamiento. Cubre configuración
        de switches, red GPU-a-GPU en el fabric backend, aprovisionamiento de
        storage ONTAP, acceso S3 para un tenant de OpenShift, grupos de recursos
        en Cisco Intersight y ejecución de NVIDIA Base Command Manager con
        corridas de ejemplo de MLPerf Training. También describe cómo añadir
        nodos C885A adicionales a un clúster OpenShift existente. Se apoya en el
        AI POD for Enterprise Training and Fine-Tuning Design Guide para el
        diseño de red y servidores, y complementa el blueprint de datacenter
        para IA/ML ya presente en el catálogo con una ruta de despliegue
        concreta sobre FlexPod.

collaboration:
  index_pages:
    - https://www.cisco.com/c/en/us/solutions/enterprise/design-zone-collaboration/index.html
  cvds:
    - title: "Cisco Preferred Architecture for On-Premises Collaboration"
      url: https://www.cisco.com/c/dam/en/us/td/docs/solutions/PA/overview/15x/clbpa15x.pdf
      version: "15.x"
      summary: >-
        Control de llamadas con Unified CM (registro de endpoints y enrutamiento)
        en clúster para redundancia. Expressway como borde (acceso remoto seguro
        y conectividad híbrida/nube) en pares HA; MRA para acceso externo sin
        VPN. CUBE como gateway PSTN (negociación de codecs y traducción de
        protocolo). Unity (mensajería unificada), IM&P (mensajería y presencia)
        y endpoints. Prácticas: redundancia geográfica, segregar voz/datos,
        monitoreo con RTMT, hardening (reglas de firewall, gestión de
        credenciales, parcheo regular).
    - title: "Cisco Preferred Architecture for Webex Calling (nube)"
      url: https://www.cisco.com/c/dam/en/us/td/docs/solutions/CVD/Collaboration/hybrid/AltDesigns/PA-WbxCall.pdf
      version: "ago 2025"
      summary: >-
        Webex Calling como control de llamadas en la nube, en despliegue aislado
        o combinado con colaboración on-prem (Unified CM). Opciones de PSTN y
        conectividad Private Network Connect (PNC): Internet, Equinix Fabric
        (Edge Connect) o PNC dedicado para asegurar QoS y baja latencia de voz.
        Variante Dedicated Instance para clientes que requieren instancia
        gestionada. Base para dimensionar por usuario/estación, sesiones PSTN
        concurrentes y modalidad cloud vs híbrida.
    - title: "Private Network Connect for Webex Calling Multi-Tenant Design Overview"
      url: https://www.cisco.com/c/dam/en/us/td/docs/solutions/CVD/Collaboration/cloud/PA-PNC.pdf
      version: "2025"
      summary: >-
        Describe Private Network Connect (PNC), un enlace IP privado,
        administrado y con soporte de QoS entre la red del cliente y Webex
        Calling, que evita el tránsito del tráfico de voz por Internet público.
        Define dos modelos de interconexión: a nivel de partner, donde se
        agregan VPNs o redes IP privadas de múltiples clientes en una misma
        interconexión con una VLAN dedicada por cliente; y a nivel de cliente,
        donde todo el ancho de banda de la interconexión queda dedicado a una
        sola empresa. El aprovisionamiento de cada interconexión requiere un
        VLAN ID único, un ASN, direcciones IP en ambos extremos y una subred
        /29, /30 o /31; se recomienda configurar interconexiones y VLANs antes
        de migrar cualquier sitio a PNC. El alcance se limita a Webex Calling:
        el resto de cargas de Webex (Meetings, Messaging, Control Hub) sigue
        viajando por Internet (over the top). Al migrar un sitio deben
        actualizarse el Local Gateway y el proxy de salida de los teléfonos
        MPP, y resincronizar los equipos. Complementa el diseño de Webex
        Calling ya presente en el catálogo con la variante de conectividad
        privada.
